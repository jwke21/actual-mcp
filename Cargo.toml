[package]
name = "actual-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.2", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "sync",
] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
prost = "0.13"
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0" # must match rmcp's version
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
